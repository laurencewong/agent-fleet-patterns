# job.conf — sourced by runner.sh. Commands run from this directory via eval.
# Available to commands: $JOB_DIR $STATE $SCRATCH $FACTS $DRAFT $DRYRUN
JOB_NAME="dev-tooling-digest"

SPOTTER="$JOB_DIR/../../../spotter"                 # the intel engine in this repo
PROFILE="$SPOTTER/profiles/ai-dev-tooling.yaml"
ENGINE_OUT="$SCRATCH/engine"

# 1. deterministic fetch -> facts. build_digest.py exits 3 on a quiet day and
#    `&&` preserves that exit code for the runner.
FETCH_CMD='python3 "$SPOTTER/engine/build_digest.py" "$PROFILE" "$ENGINE_OUT" "$STATE/seen.json" >/dev/null && cp "$ENGINE_OUT/ai-dev-tooling-facts.md" "$FACTS"'

# 2. what the model is asked to write (facts are appended by the runner)
PROMPT_FILE="prompt.md"

# 4. deterministic delivery + source-of-truth check
SEND_CMD='./send.sh'
VERIFY_CMD='./verify.sh'

# 5. only after a confirmed send: remember what was sent
PROMOTE_CMD='python3 "$SPOTTER/engine/commit_seen.py" "$ENGINE_OUT/ai-dev-tooling-ranked.json" "$STATE/seen.json"'

QUIET_DAY="silent"
